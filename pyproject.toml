[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-sync"
version = "0.4.0"
description = "Sync Claude Code sessions between a laptop and a VM over SSH — derived from claude-hop."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Franck Matsos" }, { name = "Vasileios Papadimitriou" }]
keywords = ["claude", "claude-code", "sync", "ssh", "rsync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Repository = "https://github.com/fmatsos/claude-sync"

[project.scripts]
claude-sync = "claude_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's idiom is Option()/Argument() calls in parameter defaults
"src/claude_sync/cli.py" = ["B008"]
